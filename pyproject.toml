[project]
name = "reranker-simple-benchmark"
version = "0.1.0"
description = "https://instruct.kr"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s==0.2.12",
    "einops>=0.8.1",
    "flagembedding>1.3.5",
    "kiwipiepy==0.19.0",
    "konlpy==0.6.0",
    "mteb>=2.18.0",
    "mxbai-rerank>=0.1.6",
    "sentence-transformers>=5.0",
    "transformers>=4.40.0,<6.0.0",
    "torch>=2.5.1",
    "torchvision",
    "peft>=0.20.0",
    "python-mecab-ko",
    "accelerate",
    "setproctitle>=1.3.7",
    "streamlit==1.39.0",
]

[project.optional-dependencies]
transformers-v4 = ["transformers<5"]
transformers-v5 = ["transformers>=5"]
# ColBERT/late-interaction reranking(evaluate_colbert.py) 전용. pylate 는 ST==5.3.0,
# transformers<=5.3.0 을 고정하므로 별도 extra 로 분리. reranking 은 encode+MaxSim 만
# 쓰고 PLAID/fast-plaid 는 사용하지 않는다.
#   uv sync --extra colbert && uv run --extra colbert python eval/evaluate_colbert.py ...
colbert = ["pylate>=1.6.0"]

[tool.uv]
# 단일 universal lock 에서 두 extra 가 하나의 transformers 버전으로 합쳐지지 않도록 분기.
conflicts = [[{ extra = "transformers-v4" }, { extra = "transformers-v5" }]]
